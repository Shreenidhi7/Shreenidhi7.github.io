<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreenidhi Sharma N · QA Automation Engineer / SDET</title>
<meta name="description" content="Portfolio of Shreenidhi Sharma N, ISTQB-certified QA Automation Engineer and SDET in Bengaluru. Playwright, WebDriverIO, Pytest, ReadyAPI, CI/CD.">
<meta name="theme-color" content="#F4F6F9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23172031'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='%2333C28A' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root{
  --paper:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF1F6;
  --ink:#172031; --ink-2:#2B3649; --muted:#5B6678; --faint:#8A94A6;
  --line:#DDE3EB; --line-2:#CAD2DE;
  --accent:#3A4BD8; --accent-ink:#FFFFFF; --accent-soft:#E7EAFD;
  --pass:#148A5B; --pass-soft:#DDF3EA; --amber:#B7791F; --amber-soft:#FBF0DC; --fail:#C2410C;
  --term:#172031; --term-2:#1E2A3F; --term-text:#D6DEEB; --term-dim:#7F8BA3; --term-pass:#43D19A;
  --shadow: 0 1px 0 rgba(23,32,49,.04), 0 8px 24px -12px rgba(23,32,49,.18);
  --shadow-lg: 0 30px 60px -30px rgba(23,32,49,.35);
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --side:272px; --top:64px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"]{
  --paper:#0E1422; --surface:#151D2F; --surface-2:#1B2539;
  --ink:#E7ECF4; --ink-2:#C9D2E0; --muted:#98A3B8; --faint:#6D7890;
  --line:#243049; --line-2:#2F3D5A;
  --accent:#8C98FF; --accent-ink:#0E1422; --accent-soft:#222C52;
  --pass:#3FCB91; --pass-soft:#14352A; --amber:#E3AE55; --amber-soft:#3A2D14;
  --term:#0A0F1A; --term-2:#111829;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg: 0 30px 60px -30px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color .4s var(--ease), color .4s var(--ease)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;text-decoration:none;transition:top .2s}
.skip:focus{top:12px}

/* ---------- Scroll progress ---------- */
#progress{position:fixed;inset:0 0 auto 0;height:3px;z-index:60;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--pass),var(--accent))}

/* ---------- Top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:50;display:flex;align-items:center;gap:18px;padding:0 20px 0 20px;
  background:color-mix(in srgb,var(--paper) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:calc(var(--side) - 40px)}
.mark{width:36px;height:36px;border-radius:11px;background:var(--ink);display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.mark svg{width:20px;height:20px}
.mark path{stroke:var(--term-pass);stroke-dasharray:40;stroke-dashoffset:40;animation:draw .9s .3s var(--ease) forwards}
[data-theme="dark"] .mark{background:var(--surface-2)}
@keyframes draw{to{stroke-dashoffset:0}}
.brand b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.topnav{display:flex;gap:4px;margin-right:auto;position:relative}
.topnav a{position:relative;z-index:1;text-decoration:none;font-weight:500;font-size:15px;color:var(--muted);padding:8px 14px;border-radius:999px;transition:color .25s}
.topnav a:hover{color:var(--ink)}
.topnav a[aria-current="page"]{color:var(--ink)}
.topnav .pill{position:absolute;z-index:0;top:0;height:100%;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);transition:transform .45s var(--ease-spring),width .45s var(--ease-spring),opacity .3s;opacity:0}
.actions{display:flex;align-items:center;gap:8px}
.iconbtn{height:38px;min-width:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:0 10px;color:var(--ink-2);transition:border-color .2s,transform .2s var(--ease)}
.iconbtn:hover{border-color:var(--line-2)}
.iconbtn:active{transform:scale(.96)}
.iconbtn svg{width:18px;height:18px}
.kbd{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface-2)}
.search-btn{padding:0 8px 0 12px;color:var(--muted);font-size:14.5px;min-width:190px;justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15.5px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,background-color .25s,border-color .25s;will-change:transform}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{box-shadow:0 10px 24px -10px color-mix(in srgb,var(--ink) 70%,transparent)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--line-2)}
.btn-sm{height:38px;padding:0 14px;font-size:14.5px;border-radius:11px}
.menu-btn{display:none}

/* ---------- Side nav: test explorer ---------- */
.side{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);padding:18px 14px 18px 18px;display:flex;flex-direction:column;z-index:40;overflow-y:auto}
.suite{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 8px 10px;box-shadow:var(--shadow)}
.suite-head{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 10px;color:var(--muted);font-size:13.5px;border-bottom:1px dashed var(--line);margin-bottom:8px}
.suite-head span{font-family:var(--mono);font-size:12.5px}
.suite-head .count{color:var(--pass);font-weight:600}
.snav{list-style:none;margin:0;padding:0;position:relative}
.snav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:15.5px;position:relative;z-index:1;transition:color .2s}
.snav a:hover{color:var(--ink)}
.snav a .st{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--pass-soft);color:var(--pass);transition:transform .35s var(--ease-spring)}
.snav a .st svg{width:11px;height:11px}
.snav a:hover .st{transform:scale(1.15)}
.snav a .ms{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint);opacity:0;transform:translateX(-4px);transition:.25s var(--ease)}
.snav a:hover .ms,.snav a[aria-current="page"] .ms{opacity:1;transform:none}
.snav a[aria-current="page"]{color:var(--ink);font-weight:600}
.snav .hl{position:absolute;left:0;right:0;top:0;height:40px;border-radius:11px;background:var(--surface-2);transition:transform .5s var(--ease-spring),opacity .3s;z-index:0;opacity:0}
.snav .hl::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.side-foot{margin-top:16px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--muted)}
.side-foot .open{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:600;font-size:14.5px;margin-bottom:6px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--pass);position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--pass);animation:ping 2s var(--ease) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(3);opacity:0}}
.socials{display:flex;gap:8px;margin-top:12px}
.socials a{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink-2);transition:transform .3s var(--ease-spring),border-color .2s}
.socials a:hover{transform:translateY(-3px);border-color:var(--line-2)}
.socials svg{width:17px;height:17px}

/* ---------- Main ---------- */
main{margin-left:var(--side);padding:calc(var(--top) + 18px) 36px 40px 22px;min-height:100vh}
.page{max-width:1080px}
.page-head{padding:34px 0 28px;max-width:760px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:14px;font-family:var(--mono)}
.crumb a{text-decoration:none;color:var(--muted)}
.crumb a:hover{color:var(--accent)}
.crumb .pass{color:var(--pass)}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.02em;margin:0;font-weight:700;line-height:1.08}
h1{font-size:clamp(40px,5.6vw,68px);font-weight:800;letter-spacing:-.035em;line-height:1}
h2{font-size:clamp(28px,3.2vw,38px)}
h3{font-size:22px;letter-spacing:-.015em;line-height:1.2}
.lead{font-size:clamp(18px,1.6vw,20.5px);color:var(--muted);margin:18px 0 0;max-width:62ch;line-height:1.55}
p{max-width:68ch}
.section{padding:28px 0 36px}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
.section-title p{margin:6px 0 0;color:var(--muted)}
.link{color:var(--accent);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.link svg{width:16px;height:16px;transition:transform .3s var(--ease)}
.link:hover svg{transform:translateX(4px)}
.link:hover{text-decoration:underline;text-underline-offset:4px}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:1.02fr 1fr;gap:40px;align-items:center;padding:36px 0 30px;position:relative}
.hero h1 .line{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 .line span{display:inline-block;transform:translateY(105%);animation:rise 1s var(--ease) forwards}
.hero h1 .line:nth-child(2) span{animation-delay:.12s}
.hero h1 .role{display:block;font-size:.42em;font-weight:600;letter-spacing:-.02em;color:var(--muted);margin-top:.5em}
.hero h1 .role span{animation-delay:.26s}
@keyframes rise{to{transform:none}}
.fade-in{opacity:0;transform:translateY(14px);animation:fin .9s var(--ease) forwards}
@keyframes fin{to{opacity:1;transform:none}}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink-2);font-weight:500}
.chip svg{width:15px;height:15px;color:var(--muted)}
.chip img{width:16px;height:16px}

/* Runner */
.runner{background:var(--term);color:var(--term-text);border-radius:20px;box-shadow:var(--shadow-lg);font-family:var(--mono);font-size:13.5px;line-height:1.7;overflow:hidden;position:relative;border:1px solid color-mix(in srgb,var(--term-text) 8%,transparent);transform:perspective(1400px) rotateY(-5deg) rotateX(2deg);transition:transform .8s var(--ease)}
.runner:hover{transform:perspective(1400px) rotateY(0) rotateX(0)}
.runner-bar{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--term-2);border-bottom:1px solid rgba(255,255,255,.06)}
.dots{display:flex;gap:7px}
.dots i{width:11px;height:11px;border-radius:50%;background:#3A4760}
.dots i:nth-child(1){background:#F87171}.dots i:nth-child(2){background:#FBBF24}.dots i:nth-child(3){background:#34D399}
.tabs{display:flex;gap:4px;margin-left:6px}
.tabs span{padding:3px 10px;border-radius:7px;color:var(--term-dim);font-size:12px}
.tabs span.on{background:rgba(255,255,255,.07);color:var(--term-text)}
.runner-body{padding:18px 20px 16px;min-height:420px}
.runner .cmd{color:var(--term-text)}
.runner .cmd .p{color:var(--term-pass)}
.runner .dim{color:var(--term-dim)}
.runner .t{display:flex;gap:10px;opacity:0;transform:translateX(-6px);transition:opacity .35s,transform .35s var(--ease)}
.runner .t.show{opacity:1;transform:none}
.runner .t .ok{color:var(--term-pass);flex:none;width:14px}
.runner .t .ok.spin{color:var(--term-dim);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.runner .t .ms{color:var(--term-dim);margin-left:auto;padding-left:10px;flex:none}
.runner .sum{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.1);display:flex;align-items:center;gap:14px;opacity:0;transition:opacity .5s}
.runner .sum.show{opacity:1}
.runner .sum b{color:var(--term-pass)}
.runner .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0 4px}
.runner .bar i{display:block;height:100%;width:0;background:var(--term-pass);transition:width .4s var(--ease)}
.caret{display:inline-block;width:8px;height:1.1em;background:var(--term-text);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.rerun{margin-left:auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--term-text);font-family:var(--mono);font-size:12px;border-radius:8px;padding:5px 10px;cursor:pointer;opacity:0;transition:opacity .3s,background-color .2s}
.rerun.show{opacity:1}
.rerun:hover{background:rgba(255,255,255,.14)}

/* ---------- Report stats ---------- */
.report{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.stat{padding:22px 24px;border-right:1px solid var(--line);position:relative}
.stat:last-child{border-right:0}
.stat .n{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:15px;margin-top:8px;line-height:1.35}
.stat .tag{position:absolute;top:16px;right:18px;width:8px;height:8px;border-radius:50%;background:var(--pass)}

/* ---------- Cards ---------- */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;position:relative;overflow:hidden;isolation:isolate}
.card.spot::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%)}
.card.spot:hover::before{opacity:1}
.card.lift{transition:transform .45s var(--ease),border-color .3s,box-shadow .45s var(--ease)}
.card.lift:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:var(--shadow)}
.card p{color:var(--muted);margin:10px 0 0;font-size:16px}
.card h3 a{text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0}
.card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;font-size:14px;color:var(--muted)}
.icon-tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);margin-bottom:18px;color:var(--ink-2)}
.icon-tile svg{width:22px;height:22px}
.go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:transform .4s var(--ease-spring),background-color .3s,color .3s,border-color .3s}
.go svg{width:16px;height:16px}
.card:hover .go{transform:rotate(-45deg);background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Products strip */
.product{display:flex;flex-direction:column;gap:6px;padding:22px}
.product .pname{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.product .pname i{width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));transform:rotate(45deg)}
.product p{margin:4px 0 0;font-size:15px}
.product .role{margin-top:auto;padding-top:14px;font-size:13.5px;color:var(--ink-2);font-weight:600}

/* ---------- About ---------- */
.about-grid{display:grid;grid-template-columns:340px 1fr;gap:40px;align-items:start}
.portrait{border-radius:24px;overflow:hidden;position:relative;aspect-ratio:4/5;background:var(--surface-2);box-shadow:var(--shadow-lg)}
.portrait img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 1.4s var(--ease)}
.portrait.in img{transform:scale(1)}
.portrait .badge{position:absolute;left:14px;bottom:14px;right:14px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);font-size:14px;font-weight:600}
.prose p{font-size:18px;color:var(--ink-2);margin:0 0 18px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);margin-top:26px}
.facts div{padding:16px 18px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.facts div:nth-child(2n){border-right:0}
.facts div:nth-last-child(-n+2){border-bottom:0}
.facts dt{color:var(--muted);font-size:14px}
.facts dd{margin:2px 0 0;font-weight:600}
.principle h3{font-size:19px}
.principle .num{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;margin-bottom:10px}

/* ---------- Experience timeline ---------- */
.company{display:flex;gap:18px;align-items:center;padding:22px 24px;border:1px solid var(--line);border-radius:20px;background:var(--surface);margin-bottom:26px}
.company .logo{width:56px;height:56px;border-radius:15px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;flex:none}
.company h2{font-size:26px}
.company .sub{color:var(--muted);margin-top:4px}
.timeline{position:relative;padding-left:44px}
.timeline .track{position:absolute;left:14px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.timeline .fill{position:absolute;left:14px;top:8px;width:2px;height:0;background:linear-gradient(var(--accent),var(--pass));border-radius:2px}
.role-item{position:relative;padding:0 0 26px}
.role-item .node{position:absolute;left:-39px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--line-2);display:grid;place-items:center;transition:border-color .4s,background-color .4s,transform .5s var(--ease-spring)}
.role-item .node svg{width:10px;height:10px;opacity:0;color:#fff;transition:opacity .3s}
.role-item.reached .node{border-color:var(--pass);background:var(--pass);transform:scale(1.1)}
.role-item.reached .node svg{opacity:1}
.role-item .when{font-family:var(--mono);font-size:13px;color:var(--muted)}
.role-item h3{margin-top:4px}
.role-item .now{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--pass);background:var(--pass-soft);padding:3px 10px;border-radius:999px;margin-left:10px;vertical-align:3px;font-family:var(--body)}
.work-list{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:12px}
.work-list li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:16px;color:var(--ink-2)}
.work-list li svg{width:18px;height:18px;color:var(--pass);margin-top:3px}
.work-list b{color:var(--ink)}

/* ---------- Skills ---------- */
.tiers{display:flex;gap:6px;padding:5px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto;position:relative}
.tiers button{position:relative;z-index:1;border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap;transition:color .25s}
.tiers button[aria-pressed="true"]{color:var(--paper)}
.tiers .thumb{position:absolute;z-index:0;top:5px;bottom:5px;border-radius:10px;background:var(--ink);transition:transform .45s var(--ease-spring),width .45s var(--ease-spring)}
.skill-group{padding:24px}
.skill-group h3{font-size:19px;display:flex;align-items:center;gap:10px}
.skill-group .desc{color:var(--muted);font-size:15px;margin:6px 0 16px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{display:inline-flex;align-items:center;gap:9px;padding:7px 12px 7px 8px;border-radius:11px;border:1px solid var(--line);background:var(--paper);font-size:14.5px;font-weight:500;transition:opacity .4s,transform .4s var(--ease),filter .4s,border-color .3s}
.tool img,.tool .ph{width:22px;height:22px;border-radius:6px;flex:none}
.tool .ph{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:11px;background:var(--ink);color:var(--paper)}
.tool .lvl{width:7px;height:7px;border-radius:50%;margin-left:2px}
.lvl-daily{background:var(--pass)}.lvl-built{background:var(--accent)}.lvl-explored{background:var(--amber)}
.tool.dim{opacity:.28;filter:grayscale(1);transform:scale(.97)}
.legend{display:flex;flex-wrap:wrap;gap:18px;color:var(--muted);font-size:14px;margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:8px;height:8px;border-radius:50%}
.practice-list{display:flex;flex-wrap:wrap;gap:10px}
.practice-list span{padding:9px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:15px}

/* ---------- Projects ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:999px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--muted);transition:all .25s var(--ease)}
.filters button:hover{color:var(--ink);border-color:var(--line-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters .n{opacity:.6;font-weight:500;margin-left:4px}
.repo{display:flex;flex-direction:column;min-height:220px}
.repo .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.repo .lang{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.repo .lang i{width:10px;height:10px;border-radius:50%}
.repo h3{font-size:19px;word-break:break-word}
.repo p{flex:1}
.repo .year{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.featured{display:grid;grid-template-columns:1.1fr 1fr;gap:0;padding:0}
.featured .fx{padding:30px}
.featured .code{background:var(--term);color:var(--term-text);font-family:var(--mono);font-size:13px;line-height:1.75;padding:24px 26px;margin:0;overflow:auto;border-left:1px solid var(--line)}
.code .k{color:#9CA8FF}.code .s{color:#F2C879}.code .c{color:var(--term-dim)}.code .f{color:var(--term-pass)}
.tree{font-family:var(--mono);font-size:13.5px;color:var(--muted);margin:18px 0 0;line-height:1.8}
.tree b{color:var(--ink);font-weight:500}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

/* ---------- Certifications ---------- */
.cert{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;padding:28px}
.seal{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.seal svg.ring{position:absolute;inset:0;width:100%;height:100%;animation:rot 22s linear infinite}
.seal .core{width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.02em}
@keyframes rot{to{transform:rotate(360deg)}}
.cert .issuer{color:var(--muted);font-size:15px;margin-top:6px}
.cert .yr{display:inline-block;margin-top:14px;font-family:var(--mono);font-size:13px;padding:3px 10px;border-radius:8px;background:var(--surface-2)}
.edu{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}

/* ---------- Achievements ---------- */
.ach{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.ach .card{grid-column:span 2}
.ach .card.wide{grid-column:span 3}
.ach .card.xl{grid-column:span 4;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ach .card.xl p{color:color-mix(in srgb,var(--paper) 72%,transparent)}
.ach .big{font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ach .card h3{margin-top:14px}
.ach .card.xl .flag{display:inline-flex;gap:8px;align-items:center;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13.5px;font-weight:600}
[data-theme="dark"] .ach .card.xl{background:var(--accent-soft);color:var(--ink);border-color:var(--line-2)}
[data-theme="dark"] .ach .card.xl p{color:var(--muted)}

/* ---------- Reading ---------- */
.article{padding:0;display:flex;flex-direction:column}
.article .cover{aspect-ratio:1.9/1;overflow:hidden;background:var(--surface-2);position:relative;border-bottom:1px solid var(--line)}
.article .cover img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.article:hover .cover img{transform:scale(1.05)}
.article .cover.gen{display:grid;place-items:center;background:
  radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c) 26%,transparent),transparent 60%),
  radial-gradient(90% 80% at 0% 100%,color-mix(in srgb,var(--c) 16%,transparent),transparent 60%), var(--surface-2)}
.article .cover.gen img{width:64px;height:64px;object-fit:contain}
.article .cover.gen .gt{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;color:var(--ink)}
.article .body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.article .src{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.article .src img{width:16px;height:16px;border-radius:4px}
.article h3{font-size:19px;margin-top:10px}
.article p{font-size:15px;flex:1}
.topic{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent);margin-top:14px;align-self:flex-start}

/* ---------- Contact ---------- */
.contact-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:22px}
.contact-list{display:grid;gap:12px}
.contact-row{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-decoration:none;transition:border-color .25s,transform .35s var(--ease)}
.contact-row:hover{border-color:var(--line-2);transform:translateX(4px)}
.contact-row .icon-tile{margin:0;flex:none}
.contact-row small{display:block;color:var(--muted);font-size:13.5px}
.contact-row b{font-weight:600;word-break:break-all}
.contact-row .copy{margin-left:auto}
form .field{display:grid;gap:7px;margin-bottom:16px}
form label{font-weight:600;font-size:14.5px}
form input,form textarea,form select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,box-shadow .2s}
form input:focus,form textarea:focus,form select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
form textarea{min-height:130px;resize:vertical}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}

/* ---------- Pager & footer ---------- */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
.pager a{display:block;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-decoration:none;transition:border-color .25s,transform .35s var(--ease)}
.pager a:hover{border-color:var(--accent)}
.pager a small{display:block;color:var(--muted);font-size:14px}
.pager a b{font-family:var(--display);font-size:20px;letter-spacing:-.02em}
.pager .next{text-align:right;grid-column:2}
.pager a.prev:hover{transform:translateX(-4px)}.pager a.next:hover{transform:translateX(4px)}
.foot{margin-top:40px;padding:22px 0 10px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.foot a{color:var(--muted)}

/* ---------- Reveal ---------- */
[data-reveal]{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0) * 70ms)}
[data-reveal].in{opacity:1;transform:none}

/* ---------- Command palette ---------- */
.palette{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:rgba(10,15,26,.42);backdrop-filter:blur(4px)}
.palette.open{display:flex;animation:fadeBg .2s ease}
@keyframes fadeBg{from{opacity:0}}
.pal{width:min(620px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .3s var(--ease-spring)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:18px 20px;font:inherit;font-size:17px;color:var(--ink);outline:none}
.pal ul{list-style:none;margin:0;padding:8px;max-height:52vh;overflow:auto}
.pal li a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;text-decoration:none}
.pal li a small{margin-left:auto;color:var(--muted);font-size:13px}
.pal li.sel a{background:var(--surface-2)}
.pal li a .st{width:8px;height:8px;border-radius:50%;background:var(--pass)}
.pal .empty{padding:18px;color:var(--muted)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;z-index:90;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center;transition:all .45s var(--ease-spring);pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast svg{width:18px;height:18px;color:var(--term-pass)}

/* ---------- View transitions ---------- */
::view-transition-old(page){animation:vtOut .28s var(--ease) both}
::view-transition-new(page){animation:vtIn .55s var(--ease) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-10px);filter:blur(4px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(18px);filter:blur(6px)}}
#view{view-transition-name:page}
#view:focus{outline:none}
.page.enter{animation:vtIn .55s var(--ease) both}

/* ---------- Responsive ---------- */

  .side .mobile-links{display:grid !important}

}

/* ---------- Shell: side nav ---------- */
const snav = $("#snav");
snav.insertAdjacentHTML("beforeend", ROUTES.filter(x => x.side).map(x => `<li><a href="#${x.path}" data-r="${x.id}"><span class="st">${I.check}</span>${x.title}<span class="ms">${x.ms}</span></a></li>`).join(""));

function placeIndicators(id) {
  const hl = $(".hl", snav), a = $(`a[data-r="${id}"]`, snav);
  $$("a", snav).forEach(x => x === a ? x.setAttribute("aria-current", "page") : x.removeAttribute("aria-current"));
  if (a) { hl.style.opacity = 1; hl.style.transform = `translateY(${a.parentNode.offsetTop}px)`; hl.style.height = a.offsetHeight + "px"; } else hl.style.opacity = 0;
  const tn = $("#topnav"), pill = $(".pill", tn), t = $(`a[data-r="${id}"]`, tn);
  $$("a", tn).forEach(x => x === t ? x.setAttribute("aria-current", "page") : x.removeAttribute("aria-current"));
  if (t) { pill.style.opacity = 1; pill.style.width = t.offsetWidth + "px"; pill.style.transform = `translateX(${t.offsetLeft}px)`; } else pill.style.opacity = 0;
}

/* ---------- Router ---------- */
const view = $("#view");
let current = null, runTimer = [];
function routeFromHash() {
  const p = (location.hash.replace(/^#/, "") || "/").split("?")[0];
  return ROUTES.find(x => x.path === p) || ROUTES[0];
}
function render(first) {
  const rt = routeFromHash();
  if (current === rt.id && !first) return;
  current = rt.id;
  const swap = () => {
    runTimer.forEach(clearTimeout); runTimer = [];
    view.innerHTML = `<div class="page">${PAGES[rt.id]()}</div>`;
    document.title = rt.id === "home" ? "Shreenidhi Sharma N · QA Automation Engineer / SDET" : `${rt.title} · Shreenidhi Sharma N`;
    window.scrollTo({ top: 0, behavior: "instant" });
    placeIndicators(rt.id);
    enhance(rt.id);
  };
  closeNav();
  if (!first && document.startViewTransition && !reduced) document.startViewTransition(swap);
  else { swap(); if (!first) $(".page", view).classList.add("enter"); }
  if (!first) view.focus({ preventScroll: true });
}
addEventListener("hashchange", () => render(false));

/* ---------- Page enhancements ---------- */
let io;
function enhance(id) {
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in");
    $$("[data-count]", e.target).forEach(countUp);
    if (e.target.matches("[data-count]")) countUp(e.target);
    io.unobserve(e.target);
  }), { threshold: .12, rootMargin: "0px 0px -40px 0px" });
  $$("[data-reveal]", view).forEach(el => io.observe(el));
  $$(".ach [data-count]", view).forEach(el => io.observe(el));
  if (id === "home") runSpecs();
  if (id === "about") setTimeout(() => $("#portrait")?.classList.add("in"), 100);
  if (id === "skills") initTiers();
  if (id === "projects") initFilter("#filters", "#repoGrid", (el, f) => f === "all" || el.dataset.cat === f);
  if (id === "reading") initFilter("#afilters", "#artGrid", (el, f) => f === "All" || el.dataset.cat === f);
  if (id === "contact") initContact();
  onScroll();
}

function countUp(el) {
  if (el.dataset.done) return; el.dataset.done = 1;
  const to = +el.dataset.count, dur = reduced ? 0 : 1400, t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / (dur || 1)), e = 1 - Math.pow(1 - k, 4); el.textContent = Math.round(to * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* Hero test runner */
function runSpecs() {
  const box = $("#runner"), btn = $("#rerun"); if (!box) return;
  runTimer.forEach(clearTimeout); runTimer = [];
  btn.classList.remove("show");
  const cmd = "npx playwright test career.spec.ts";
  box.innerHTML = `<div class="cmd"><span class="p">$</span> <span id="typed"></span><span class="caret"></span></div><div id="rlines" style="margin-top:10px"></div>`;
  const typed = $("#typed", box), lines = $("#rlines", box);
  const later = (fn, ms) => runTimer.push(setTimeout(fn, ms));
  if (reduced) {
    typed.textContent = cmd;
    lines.innerHTML = runnerStatic();
    btn.classList.add("show"); return;
  }
  let i = 0;
  const type = () => { typed.textContent = cmd.slice(0, ++i); if (i < cmd.length) later(type, 28 + Math.random() * 40); else later(start, 350); };
  later(type, 700);
  function start() {
    $(".caret", box)?.remove();
    lines.innerHTML = `<div class="dim">Running ${SPECS.length} tests using 3 workers</div><div class="dim" style="margin:8px 0 2px">career.spec.ts › Shreenidhi Sharma N</div><div class="bar"><i id="rbar"></i></div><div id="rlist"></div>`;
    const list = $("#rlist", box), bar = $("#rbar", box);
    let k = 0, total = 0;
    const next = () => {
      if (k >= SPECS.length) return finish(total);
      const [name, ms] = SPECS[k];
      const row = document.createElement("div"); row.className = "t";
      row.innerHTML = `<span class="ok spin">◌</span><span>${name}</span><span class="ms">…</span>`;
      list.appendChild(row); requestAnimationFrame(() => row.classList.add("show"));
      later(() => { const ok = $(".ok", row); ok.className = "ok"; ok.textContent = "✓"; $(".ms", row).textContent = `(${ms}ms)`; total += ms; k++; bar.style.width = (k / SPECS.length * 100) + "%"; later(next, 110); }, 170 + ms * .35);
    };
    next();
  }
  function finish(total) {
    lines.insertAdjacentHTML("beforeend", `<div class="sum" id="rsum"><b>${SPECS.length} passed</b><span class="dim">0 failed, 0 flaky</span><span class="dim" style="margin-left:auto">${(total / 1000 + 1.2).toFixed(1)}s</span></div>`);
    requestAnimationFrame(() => $("#rsum", box).classList.add("show"));
    btn.classList.add("show");
  }
}
function runnerStatic() {
  return `<div class="dim">Running ${SPECS.length} tests using 3 workers</div><div style="margin-top:8px">${SPECS.map(([n, ms]) => `<div class="t show"><span class="ok">✓</span><span>${n}</span><span class="ms">(${ms}ms)</span></div>`).join("")}</div><div class="sum show"><b>${SPECS.length} passed</b><span class="dim">0 failed, 0 flaky</span></div>`;
}
view.addEventListener("click", e => { if (e.target.closest("#rerun")) runSpecs(); });

/* Skills tier filter */
function initTiers() {
  const wrap = $("#tiers"), thumb = $(".thumb", wrap);
  const place = b => { thumb.style.width = b.offsetWidth + "px"; thumb.style.transform = `translateX(${b.offsetLeft - 5}px)`; };
  const btns = $$("button", wrap); place(btns[0]);
  btns.forEach(b => b.addEventListener("click", () => {
    btns.forEach(x => x.setAttribute("aria-pressed", x === b)); place(b);
    $$(".tool", view).forEach(t => t.classList.toggle("dim", b.dataset.t !== "all" && t.dataset.lvl !== b.dataset.t));
  }));
}

/* FLIP filter */
function initFilter(fSel, gSel, match) {
  const bar = $(fSel), grid = $(gSel); if (!bar) return;
  $$("button", bar).forEach(b => b.addEventListener("click", () => {
    $$("button", bar).forEach(x => x.setAttribute("aria-pressed", x === b));
    const items = $$(":scope > *", grid);
    const first = new Map(items.map(el => [el, el.getBoundingClientRect()]));
    items.forEach(el => { el.style.display = match(el, b.dataset.f) ? "" : "none"; el.classList.add("in"); });
    if (reduced) return;
    items.forEach(el => {
      if (el.style.display === "none") return;
      const a = first.get(el), z = el.getBoundingClientRect();
      if (!a.width) { el.animate([{ opacity: 0, transform: "scale(.94)" }, { opacity: 1, transform: "none" }], { duration: 450, easing: "cubic-bezier(.2,.8,.2,1)" }); return; }
      const dx = a.left - z.left, dy = a.top - z.top;
      if (dx || dy) el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: "none" }], { duration: 550, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }));
}

/* Contact */
function initContact() {
  $$("[data-copy]", view).forEach(b => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); toast("Copied " + b.dataset.copy); }
    catch { toast("Copy failed. Select the text instead."); }
  }));
  $("#mailForm").addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target, n = f.name.value.trim(), m = f.msg.value.trim();
    if (!n || !m) { (n ? f.msg : f.name).focus(); toast(n ? "Add a message before opening email" : "Add your name before opening email"); return; }
    location.href = `mailto:shreenidhisharma7@gmail.com?subject=${encodeURIComponent(f.topic.value + " – from " + n)}&body=${encodeURIComponent(m)}`;
    toast("Opening your email app");
  });
}
let tt;
function toast(msg) { const t = $("#toast"); $("#toastMsg").textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2400); }

/* ---------- Global interactions ---------- */
// Spotlight on cards
document.addEventListener("pointermove", e => {
  const c = e.target.closest?.(".spot"); if (!c) return;
  const b = c.getBoundingClientRect();
  c.style.setProperty("--mx", e.clientX - b.left + "px"); c.style.setProperty("--my", e.clientY - b.top + "px");
}, { passive: true });
// Magnetic buttons
if (!reduced && matchMedia("(pointer:fine)").matches) {
  document.addEventListener("pointermove", e => {
    $$(".magnetic", view).forEach(b => {
      const r = b.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
      const d = Math.hypot(x, y);
      b.style.transform = d < 90 ? `translate(${x * .18}px,${y * .25}px)` : "";
    });
  }, { passive: true });
}
// Scroll progress + timeline
const prog = $("#progress"), topbar = $("#topbar");
function onScroll() {
  const h = document.documentElement, max = h.scrollHeight - h.clientHeight;
  prog.style.transform = `scaleX(${max > 0 ? h.scrollTop / max : 0})`;
  topbar.classList.toggle("scrolled", h.scrollTop > 8);
  const tl = $("#timeline");
  if (tl) {
    const b = tl.getBoundingClientRect(), mid = innerHeight * .6;
    const p = Math.max(0, Math.min(1, (mid - b.top) / (b.height - 16)));
    $("#tlFill").style.height = (p * (b.height - 16)) + "px";
    $$(".role-item", tl).forEach(ri => ri.classList.toggle("reached", ri.getBoundingClientRect().top + 16 < mid));
  }
}
addEventListener("scroll", () => requestAnimationFrame(onScroll), { passive: true });
addEventListener("resize", () => placeIndicators(current));

// Theme
const root = document.documentElement, themeBtn = $("#themeBtn");
function setTheme(t) {
  root.dataset.theme = t;
  $("#themeIcon").innerHTML = t === "dark" ? I.sun : I.moon;
  themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
  $('meta[name="theme-color"]').content = t === "dark" ? "#0E1422" : "#F4F6F9";
  try { localStorage.setItem("ss-theme", t); } catch {}
}
let saved; try { saved = localStorage.getItem("ss-theme"); } catch {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
themeBtn.addEventListener("click", () => {
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  if (document.startViewTransition && !reduced) {
    const vt = document.startViewTransition(() => setTheme(next));
    vt.ready.then(() => {
      const r = themeBtn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      root.animate({ clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] }, { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)", pseudoElement: "::view-transition-new(root)" });
    }).catch(() => {});
  } else setTheme(next);
});

// Mobile nav
const menuBtn = $("#menuBtn");
function closeNav() { document.body.classList.remove("nav-open"); menuBtn.setAttribute("aria-expanded", "false"); }
menuBtn.addEventListener("click", () => { const o = document.body.classList.toggle("nav-open"); menuBtn.setAttribute("aria-expanded", o); if (o) setTimeout(() => placeIndicators(current), 50); });
$("#scrim").addEventListener("click", closeNav);

// Command palette
const pal = $("#palette"), pin = $("#palInput"), plist = $("#palList");
const PAL = [
  ...ROUTES.map(x => ({ label: x.title, hint: "Page", href: "#" + x.path })),
  ...SKILLS.flatMap(g => g.tools.map(t => ({ label: t.name, hint: "Skill", href: "#/skills" }))),
  ...REPOS.map(x => ({ label: x.n.replace(/-/g, " "), hint: "GitHub", href: GH + x.n, ext: true })),
  ...CERTS.map(c => ({ label: c.t, hint: "Certification", href: "#/certifications" })),
  { label: "Download résumé", hint: "PDF", href: RESUME, dl: true }
].filter((v, i, a) => a.findIndex(w => w.label === v.label) === i);
let sel = 0, shown = [];
function drawPal() {
  const q = pin.value.trim().toLowerCase();
  shown = PAL.filter(p => !q || p.label.toLowerCase().includes(q) || p.hint.toLowerCase().includes(q)).slice(0, 9);
  sel = Math.min(sel, Math.max(0, shown.length - 1));
  plist.innerHTML = shown.length ? shown.map((p, i) => `<li role="option" aria-selected="${i === sel}" class="${i === sel ? "sel" : ""}"><a href="${p.href}" ${p.ext ? 'target="_blank" rel="noopener"' : ""} ${p.dl ? "download" : ""}><span class="st"></span>${p.label}<small>${p.hint}</small></a></li>`).join("")
    : `<li class="empty">No pages or skills match "${pin.value}". Try "Playwright" or "Experience".</li>`;
}
function openPal() { pal.classList.add("open"); pin.value = ""; sel = 0; drawPal(); pin.focus(); }
function closePal() { pal.classList.remove("open"); }
$("#openPal").addEventListener("click", openPal);
pal.addEventListener("click", e => { if (e.target === pal || e.target.closest("a")) closePal(); });
pin.addEventListener("input", () => { sel = 0; drawPal(); });
pin.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { sel = (sel + 1) % shown.length; drawPal(); e.preventDefault(); }
  if (e.key === "ArrowUp") { sel = (sel - 1 + shown.length) % shown.length; drawPal(); e.preventDefault(); }
  if (e.key === "Enter") { const a = $$("a", plist)[sel]; if (a) { a.click(); closePal(); } }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); pal.classList.contains("open") ? closePal() : openPal(); }
  if (e.key === "Escape") { closePal(); closeNav(); }
  if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); openPal(); }
});
if (/Mac/.test(navigator.platform)) $(".search-btn .kbd").textContent = "⌘K";

// Go
render(true);
document.fonts?.ready.then(() => placeIndicators(current));
})();

</script>
</body>
